[project]
name = "store-emulator"
version = "0.2.0"
description = "TwinStore backend: store digital twin with LLM/VLM-driven synthetic shoppers (built on Parastore)."
license = { text = "TwinStore License 1.0 (see LICENSE at the repository root); Parastore-derived code MIT" }
requires-python = ">=3.13"
authors = [
    { name = "intellicia", email = "dev@intellicia.co" },
]
maintainers = [
    { name = "Rafael Kim", email = "doom0728@gmail.com" },
    { name = "SungHyun Lee", email = "lavelee15@gmail.com" },
    { name = "Dg Goo", email = "dg.goo@intellicia.co" },
]
dependencies = [
    "fastapi[standard]>=0.135.3",
    "filelock>=3.25.2",
    "instructor>=1.15.1",
    "litellm>=1.83.4",
    "openpyxl>=3.1,<4",
    "numpy>=2.5.4",
    "pandas>=3.0.3",
    "pathfinding>=1.0.20",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.1",
    "pypdfium2>=5.14.0",
]

[project.optional-dependencies]
# Shelf capture with the Grounding DINO detector. Install with: uv sync --extra capture
capture = [
    "torch>=2.14.1",
    # <5.16: later releases need tokenizers>=0.23.1, but litellm pins tokenizers==0.22.2.
    "transformers>=5.15.1,<5.16",
]

[project.scripts]
twinstore = "store_emulator.cli:main"
twinstore-app = "store_emulator.launcher:main"
parastore = "store_emulator.cli:main"           # former names, kept for scripts that use them
parastore-app = "store_emulator.launcher:main"

[project.urls]
Homepage = "https://github.com/BrainJellyPie/twinstore"
Repository = "https://github.com/BrainJellyPie/twinstore"
Issues = "https://github.com/BrainJellyPie/twinstore/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_emulator"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = [".venv", "**/__pycache__"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Keep failed fixtures for debugging; successful sample-project copies can fill /tmp across runs.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
