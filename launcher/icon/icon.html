<!doctype html>
<!-- TwinStore app icon. Rendered to PNG by render.mjs:
     ?variant=mac  → Apple icon grid (824 px body on a 1024 canvas, soft shadow)
     ?variant=flat → full-bleed rounded square for Windows / Linux / the web
     ?small=1      → heavier strokes that survive 16–32 px -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --c1: #3fdfff; --c2: #a586ff; --c3: #ff5fc6; --volt: #c6ff3a; --ink: #0b0c10; }
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .body {
    position: relative; width: 824px; height: 824px; border-radius: 186px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 10%, #1b1d27 0%, var(--ink) 55%, #050608 100%);
    box-shadow: 0 28px 48px -18px rgb(0 0 0 / 0.55), 0 8px 18px -8px rgb(0 0 0 / 0.4);
  }
  .flat .body { width: 1000px; height: 1000px; border-radius: 224px; box-shadow: none; }
  /* aurora ring: a conic gradient behind an inset panel, blurred into a glowing rim */
  .ring {
    position: absolute; inset: -18%;
    background: conic-gradient(from 210deg, var(--c1), var(--c2), var(--c3), var(--volt), var(--c1));
    filter: blur(46px) saturate(1.25);
  }
  .panel {
    position: absolute; inset: 30px; border-radius: 160px;
    background:
      radial-gradient(80% 60% at 50% 0%, rgb(255 255 255 / 0.10), transparent 60%),
      radial-gradient(70% 70% at 50% 60%, #12141b 0%, #0a0b0f 70%);
    box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.14), inset 0 -30px 60px rgb(0 0 0 / 0.5);
  }
  .flat .panel { inset: 34px; border-radius: 194px; }
  /* faint floor grid and aurora heat glow under the shelf block */
  .grid {
    position: absolute; inset: 30px; border-radius: 160px; opacity: 0.22;
    background-image: linear-gradient(rgb(165 134 255 / 0.5) 2px, transparent 2px),
                      linear-gradient(90deg, rgb(63 223 255 / 0.5) 2px, transparent 2px);
    background-size: 72px 72px; background-position: center;
    mask-image: radial-gradient(60% 45% at 50% 72%, #000 0%, transparent 75%);
    transform: perspective(700px) rotateX(58deg) translateY(150px) scale(1.35);
  }
  .heat {
    position: absolute; left: 50%; top: 66%; width: 520px; height: 220px; translate: -50% -50%;
    background: radial-gradient(closest-side, rgb(255 95 198 / 0.55), rgb(165 134 255 / 0.35) 45%, transparent 100%);
    filter: blur(24px);
  }
  svg { position: absolute; inset: 0; margin: auto; width: 80%; height: 80%; overflow: visible; }
  .small .ring { filter: blur(30px) saturate(1.3); }
  .small .grid, .small .heat { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="body">
    <div class="ring"></div>
    <div class="panel"></div>
    <div class="grid"></div>
    <div class="heat"></div>
    <svg viewBox="0 0 24 24" id="mark">
      <defs>
        <linearGradient id="twin" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3fdfff" />
          <stop offset="0.55" stop-color="#a586ff" />
          <stop offset="1" stop-color="#ff5fc6" />
        </linearGradient>
        <linearGradient id="face-t" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
          <stop offset="1" stop-color="#dfe3ee" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="face-l" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c9cedb" />
          <stop offset="1" stop-color="#9aa1b4" />
        </linearGradient>
        <linearGradient id="face-r" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7d8499" />
          <stop offset="1" stop-color="#4c5266" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="0.5" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>
      <!-- the digital twin: a glowing wireframe double, behind and to the right -->
      <g filter="url(#glow)" fill="none" stroke="url(#twin)" stroke-linejoin="round" id="twin-g">
        <path d="M15.2 4.4 19.7 7v5.2l-4.5 2.6-4.5-2.6V7Z" stroke-width="0.9" class="w" />
        <path d="M10.7 7 15.2 9.6 19.7 7M15.2 9.6v5.2" stroke-width="0.9" class="w" />
        <g class="scan" stroke-width="0.35" opacity="0.7">
          <path d="M15.9 10.85 19 9.05M15.9 12.25 19 10.45M15.9 13.65 19 11.85" />
        </g>
      </g>
      <!-- sync links between matching corners -->
      <g stroke="#c6ff3a" stroke-width="0.4" stroke-dasharray="0.6 0.7" opacity="0.9" class="links">
        <path d="M9 8 15.2 4.4M13.5 10.6 19.7 7M13.5 15.8 19.7 12.2" />
      </g>
      <!-- the physical store: a solid shelf block in front -->
      <path d="M9 8 13.5 10.6 9 13.2 4.5 10.6Z" fill="url(#face-t)" />
      <path d="M4.5 10.6 9 13.2v5.2l-4.5-2.6Z" fill="url(#face-l)" />
      <path d="M13.5 10.6 9 13.2v5.2l4.5-2.6Z" fill="url(#face-r)" />
      <g stroke="#0b0c10" stroke-opacity="0.35" stroke-width="0.35" fill="none" class="shelves">
        <path d="M4.5 12.35 9 14.95M4.5 14.05 9 16.65M13.5 12.35 9 14.95M13.5 14.05 9 16.65" />
      </g>
      <path d="M9 8 13.5 10.6v5.2L9 18.4l-4.5-2.6v-5.2Z" fill="none" stroke="white" stroke-width="0.7" stroke-linejoin="round" id="outline" />
      <circle cx="15.2" cy="4.4" r="1.15" fill="#c6ff3a" />
    </svg>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const stage = document.getElementById("stage");
  if (q.get("variant") === "flat") stage.classList.add("flat");
  if (q.get("small")) {
    stage.classList.add("small");
    document.getElementById("outline").setAttribute("stroke-width", "1.1");
    for (const el of document.querySelectorAll("#twin-g .w")) el.setAttribute("stroke-width", "1.5");
    for (const sel of [".shelves", ".scan", ".links"]) document.querySelector(sel).style.display = "none";
    document.getElementById("twin-g").removeAttribute("filter");
    document.getElementById("mark").style.width = document.getElementById("mark").style.height = "84%";
  }
</script>
</body>
</html>
