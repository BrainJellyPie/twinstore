# Builds the one-click downloads: one archive per OS, each with a single TwinStore icon to
# double-click. The web UI is prebuilt and shipped inside, so end users need neither Node.js nor
# Python preinstalled (the launcher fetches uv, which brings Python and the dependencies).
#
#   TwinStore-<v>-windows-x64.zip    TwinStore/TwinStore.exe + TwinStore/app/
#   TwinStore-<v>-macos.zip          TwinStore.app (universal; app files inside the bundle)
#   TwinStore-<v>-linux-x64.tar.gz   TwinStore/twinstore + TwinStore/app/
#   TwinStore-<v>-linux-arm64.tar.gz
#
# Runs on version tags (v*) and on demand (Actions → Release bundle → Run workflow). On demand, a
# version such as v0.4.0 creates that tag on the selected commit and publishes its release; left
# empty, the run only builds snapshot archives.
name: Release bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.4.0 (creates the tag and the release). Leave empty for a snapshot build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    outputs:
      version: ${{ steps.launchers.outputs.version }}
    steps:
      - name: Check version
        run: |
          if [ -n "$RELEASE_TAG" ] && ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v0.4.0, got '$RELEASE_TAG'"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Test release tag handling
        run: python3 .github/tests/test_release_workflow.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build web UI (same-origin API)
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          touch dist/.prebuilt

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Backend smoke test
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -c "from store_emulator.server.main import app; print('OK')"
          uv run pytest -q -x

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: launcher/go.mod

      - name: Build launchers
        id: launchers
        run: |
          VERSION="${RELEASE_TAG#v}"
          [ -n "$RELEASE_TAG" ] || VERSION="0.0.0-snapshot.${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          VERSION="$VERSION" launcher/build.sh

      - name: Package
        run: |
          set -e
          mkdir -p out payload
          # app files: backend, the prebuilt UI and the docs (no sources the app does not need)
          git archive HEAD backend LICENSE README.md QUICKSTART.md USAGE.md SHELF_LAB.md | tar -x -C payload
          mkdir -p payload/frontend && cp -r frontend/dist payload/frontend/dist

          launcher_smoke() {  # the packaged launcher must find its app files and start them
            "$1" --smoke --no-browser --port 8765
          }

          # Windows
          mkdir -p win/TwinStore && cp launcher/dist/TwinStore.exe win/TwinStore/ && cp -r payload win/TwinStore/app
          (cd win && zip -qr "../out/TwinStore-$VERSION-windows-x64.zip" TwinStore)

          # macOS: everything inside the bundle, so the download is a single icon
          cp -r launcher/dist/TwinStore.app mac.app
          mkdir -p mac && mv mac.app mac/TwinStore.app && cp -r payload mac/TwinStore.app/Contents/Resources/app
          # An ad-hoc signature sealing the whole bundle (the Go linker signs only the arm64 executable): Apple silicon
          # Macs call a download whose bundle is not sealed "damaged" instead of offering Open Anyway.
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign" sign mac/TwinStore.app
          (cd mac && zip -qry "../out/TwinStore-$VERSION-macos.zip" TwinStore.app)

          # Linux
          for arch in x64 arm64; do
            rm -rf lin && mkdir -p lin/TwinStore
            cp "launcher/dist/twinstore-linux-$arch" lin/TwinStore/twinstore && chmod +x lin/TwinStore/twinstore
            cp -r payload lin/TwinStore/app
            tar -C lin -czf "out/TwinStore-$VERSION-linux-$arch.tar.gz" TwinStore
            if [ "$arch" = x64 ]; then launcher_smoke lin/TwinStore/twinstore; fi  # after packing: it creates .venv and .data
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: TwinStore-${{ env.VERSION }}
          path: out/*

  # The downloads start on the systems they are for before anything is published: the Windows and macOS launchers run
  # their first start (uv, Python, every package, the server answering) on clean runners, as a user's computer would.
  smoke-windows:
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TwinStore-${{ needs.bundle.outputs.version }}
          path: dl
      - name: First start on Windows
        shell: pwsh
        run: |
          Expand-Archive -Path "dl/TwinStore-${{ needs.bundle.outputs.version }}-windows-x64.zip" -DestinationPath win
          # A GUI-subsystem program: wait for it explicitly, PowerShell would not.
          $p = Start-Process -FilePath "win/TwinStore/TwinStore.exe" -ArgumentList "--smoke", "--no-browser", "--port", "8765" -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA "TwinStore/logs/launcher.log"
          if (Test-Path $log) {
            Get-Content $log -Tail 120
            # The main steps as an annotation, readable from the API without the full log.
            $steps = Get-Content $log | Select-String -Pattern "launcher|Starting|Data folder|ready|smoke|Simulator|error|fail" | Select-Object -Last 25
            Write-Output ("::notice title=Windows first start::" + (($steps | ForEach-Object { $_.Line }) -join "%0A"))
          }
          if ($p.ExitCode -ne 0) { Write-Error "TwinStore.exe --smoke exited with $($p.ExitCode)"; exit 1 }

  smoke-macos:
    needs: bundle
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TwinStore-${{ needs.bundle.outputs.version }}
          path: dl
      - name: First start on macOS
        run: |
          ditto -x -k "dl/TwinStore-${{ needs.bundle.outputs.version }}-macos.zip" mac
          codesign --verify --deep --strict --verbose=2 mac/TwinStore.app
          status=0
          mac/TwinStore.app/Contents/MacOS/twinstore --smoke --no-browser --port 8765 || status=$?
          log="$HOME/Library/Application Support/TwinStore/logs/launcher.log"
          tail -n 120 "$log" || true
          # The main steps as an annotation, readable from the API without the full log.
          echo "::notice title=macOS first start::$(grep -E 'launcher|Starting|Data folder|ready|smoke|Simulator|error|fail' "$log" | tail -n 25 | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
          exit $status

  publish:
    needs: [bundle, smoke-windows, smoke-macos]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TwinStore-${{ needs.bundle.outputs.version }}
          path: out

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk -v ref="$tag_ref" '$2 == ref {plain=$1} $2 == (ref "^{}") {peeled=$1} END {print peeled ? peeled : plain}')"
          if [ -z "$remote_commit" ]; then
            # A competing tag must make this push fail; never replace another release's tag.
            git push origin "$release_commit:$tag_ref"
          elif [ "$remote_commit" != "$release_commit" ]; then
            echo "::error::Tag $RELEASE_TAG points to $remote_commit, but these artifacts were built from $release_commit. Choose a new version."
            exit 1
          fi
          gh release create "$RELEASE_TAG" out/* --verify-tag --target "$release_commit" --title "TwinStore $RELEASE_TAG" --notes-file - <<'NOTES'
          > [!NOTE]
          > **Windows may say "Windows protected your PC".** That is normal for a new app without a code-signing
          > certificate, not a virus warning: click **More info → Run anyway**. On a Mac, open TwinStore once, then
          > System Settings → Privacy & Security → **Open Anyway**.

          Download the file for your computer, unpack it, and double-click **TwinStore**.

          | Computer | Download | Double-click |
          | --- | --- | --- |
          | Windows 10/11 | `TwinStore-…-windows-x64.zip` | `TwinStore.exe` |
          | macOS 11+ (Apple silicon or Intel) | `TwinStore-…-macos.zip` | `TwinStore.app` |
          | Linux x64 / arm64 | `TwinStore-…-linux-*.tar.gz` | `twinstore` (afterwards also in the app menu) |

          The first start downloads Python and the packages (a few minutes, once). See QUICKSTART.md.
          Closing the browser tab does not stop TwinStore: use **Quit TwinStore** in the app when you are done.
          NOTES
