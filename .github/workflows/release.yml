# Builds the one-click downloads: one archive per OS, each with a single TwinStore icon to
# double-click. The web UI is prebuilt and shipped inside, so end users need neither Node.js nor
# Python preinstalled (the launcher fetches uv, which brings Python and the dependencies).
#
#   TwinStore-<v>-windows-x64.zip    TwinStore/TwinStore.exe + TwinStore/app/
#   TwinStore-<v>-macos.zip          TwinStore.app (universal; app files inside the bundle)
#   TwinStore-<v>-linux-x64.tar.gz   TwinStore/twinstore + TwinStore/app/
#   TwinStore-<v>-linux-arm64.tar.gz
#
# Runs on version tags (v*) and on demand (Actions → Release bundle → Run workflow). On demand, a
# version such as v0.4.0 creates that tag on the selected commit and publishes its release; left
# empty, the run only builds snapshot archives.
name: Release bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.4.0 (creates the tag and the release). Leave empty for a snapshot build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - name: Check version
        run: |
          if [ -n "$RELEASE_TAG" ] && ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v0.4.0, got '$RELEASE_TAG'"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build web UI (same-origin API)
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          touch dist/.prebuilt

      - uses: astral-sh/setup-uv@v6

      - name: Backend smoke test
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -c "from store_emulator.server.main import app; print('OK')"
          uv run pytest -q -x

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: launcher/go.mod

      - name: Build launchers
        run: |
          VERSION="${RELEASE_TAG#v}"
          [ -n "$RELEASE_TAG" ] || VERSION="0.0.0-snapshot.${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" launcher/build.sh

      - name: Package
        run: |
          set -e
          mkdir -p out payload
          # app files: backend, the prebuilt UI and the docs (no sources the app does not need)
          git archive HEAD backend LICENSE README.md QUICKSTART.md USAGE.md SHELF_LAB.md | tar -x -C payload
          mkdir -p payload/frontend && cp -r frontend/dist payload/frontend/dist

          launcher_smoke() {  # the packaged launcher must find its app files and start them
            "$1" --smoke --no-browser --port 8765
          }

          # Windows
          mkdir -p win/TwinStore && cp launcher/dist/TwinStore.exe win/TwinStore/ && cp -r payload win/TwinStore/app
          (cd win && zip -qr "../out/TwinStore-$VERSION-windows-x64.zip" TwinStore)

          # macOS: everything inside the bundle, so the download is a single icon
          cp -r launcher/dist/TwinStore.app mac.app
          mkdir -p mac && mv mac.app mac/TwinStore.app && cp -r payload mac/TwinStore.app/Contents/Resources/app
          (cd mac && zip -qry "../out/TwinStore-$VERSION-macos.zip" TwinStore.app)

          # Linux
          for arch in x64 arm64; do
            rm -rf lin && mkdir -p lin/TwinStore
            cp "launcher/dist/twinstore-linux-$arch" lin/TwinStore/twinstore && chmod +x lin/TwinStore/twinstore
            cp -r payload lin/TwinStore/app
            tar -C lin -czf "out/TwinStore-$VERSION-linux-$arch.tar.gz" TwinStore
            if [ "$arch" = x64 ]; then launcher_smoke lin/TwinStore/twinstore; fi  # after packing: it creates .venv and .data
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: TwinStore-${{ env.VERSION }}
          path: out/*

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" out/* --target "$GITHUB_SHA" --title "TwinStore $RELEASE_TAG" --notes-file - <<'NOTES'
          Download the file for your computer, unpack it, and double-click **TwinStore**.

          | Computer | Download | Double-click |
          | --- | --- | --- |
          | Windows 10/11 | `TwinStore-…-windows-x64.zip` | `TwinStore.exe` |
          | macOS 11+ (Apple silicon or Intel) | `TwinStore-…-macos.zip` | `TwinStore.app` |
          | Linux x64 / arm64 | `TwinStore-…-linux-*.tar.gz` | `twinstore` (afterwards also in the app menu) |

          The first start downloads Python and the packages (a few minutes, once). See QUICKSTART.md.
          NOTES
